name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (tts crate #28 / rodio alsa)
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libasound2-dev
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps (tts crate #28 / rodio alsa)
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libasound2-dev
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  lint-data:
    name: Lint question data (#60)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (tts crate #28 / rodio alsa)
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libasound2-dev
      - name: Run question-data linter
        run: cargo run --bin lint-questions -- data/questions_ja.json data/questions_en.json
      - name: Verify kana/ASCII ja_typings are canonical (#135)
        run: cargo run --bin review-ja-typings -- verify data/questions_ja.json
      - name: Set up Python (for IME-strict ja_typings lint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run IME-strict ja_typings lint (long vowel / ティ / ディ / kunrei / English literal / spurious /)
        run: python3 scripts/lint_ja_typings.py
      - name: Verify ja/en choice data stays in sync (#134)
        run: python3 scripts/kanji_review.py verify-sync
